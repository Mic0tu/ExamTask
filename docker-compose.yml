services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass
      POSTGRES_DB: exam
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d exam"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: s3user
      MINIO_ROOT_PASSWORD: s3pass
      MINIO_NOTIFY_WEBHOOK_ENABLE_img: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_img: "http://img-service:8000/img/process"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
      img-service:
        condition: service_started
    environment:
      MINIO_HOST: minio
      MINIO_PORT: 9000
      S3_USER: s3user
      S3_PASS: s3pass
    volumes:
      - ./scripts/minio-init.sh:/minio-init.sh
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  api-service:
    build: ./api-service
    ports:
      - "8080:8000"
    environment:
      S3_HOST: minio
      S3_PORT: 9000
      S3_USER: s3user
      S3_PASS: s3pass
      S3_EXTERNAL_URL: http://localhost:9000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dbuser
      DB_PASS: dbpass
      DB_NAME: exam
      JWKS_URL: https://id.klsh.ru/realms/sirius/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  img-service:
    build: ./img-service
    environment:
      S3_HOST: minio
      S3_PORT: 9000
      S3_USER: s3user
      S3_PASS: s3pass
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dbuser
      DB_PASS: dbpass
      DB_NAME: exam
      PUSH_ENDPOINT: http://push-service:8000/notify
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      push-service:
        condition: service_started

  push-service:
    build: ./push-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dbuser
      DB_PASS: dbpass
      DB_NAME: exam
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
